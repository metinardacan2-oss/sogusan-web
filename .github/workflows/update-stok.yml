name: Stok Verisi Güncelleyici

on:
  schedule:
    - cron: '*/15 * * * *' # Her 15 dakikada bir otomatik çalışır
  workflow_dispatch: # Manuel çalıştırma butonu ekler

permissions:
  contents: write

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Google Sheet Verisini Çek ve JSON Kaydet
        env:
          GAS_URL: ${{ secrets.GAS_API_URL }}
        run: |
          curl -L "$GAS_URL" -o stok-data.json

      - name: Değişiklik Varsa Kaydet ve Push Et
        run: |
          git config --global user.name "Stok Botu"
          git config --global user.email "bot@sogusansogutma.com"
          git add stok-data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update stok-data.json [skip ci]" && git push)
