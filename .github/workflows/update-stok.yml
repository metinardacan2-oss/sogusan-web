name: Stok Verisi Güncelleyici

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4.2.2

      - name: Python Paketini Kur ve Veriyi İndir
        env:
          GAS_URL: ${{ secrets.GAS_API_URL }}
        run: |
          python3 -m pip install --upgrade requests
          python3 -c "
          import requests, os
          url = os.environ['GAS_URL']
          response = requests.get(url, allow_redirects=True, timeout=30)
          response.raise_for_status()
          with open('stok-data.json', 'wb') as f:
              f.write(response.content)
          "

      - name: Değişiklik Varsa Kaydet ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stok-data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update stok-data.json [skip ci]" && git push)
