name: Stok Verisi Güncelleyici

on:
  schedule:
    - cron: '*/15 * * * *' # Her 15 dakikada bir otomatik çalışır
  workflow_dispatch: # Manuel çalıştırma butonu

permissions:
  contents: write

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4.2.2

      - name: Python Paketini Kur ve Veriyi İndir
        run: |
          python3 -m pip install --upgrade requests
          python3 -c "
          import requests
          url = 'https://script.google.com/macros/s/AKfycbxYEwhzKzDaZVzCYaJYuU9hbz_Zlo8_JKyntw4qUwf61P15A0DcLXp4xElRHw0MOKQ/exec'
          response = requests.get(url, allow_redirects=True, timeout=30)
          response.raise_for_status()
          with open('stok-data.json', 'wb') as f:
              f.write(response.content)
          print('Stok verisi başarıyla indirildi.')
          "

      - name: Değişiklik Varsa Kaydet ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stok-data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update stok-data.json [skip ci]" && git push)
