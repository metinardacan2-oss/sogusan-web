name: Stok Verisi Güncelleyici

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Google Sheet Verisini Çek ve JSON Kaydet
        env:
          GAS_URL: ${{ secrets.GAS_API_URL }}
        run: |
          curl -s -L -k --retry 3 "${GAS_URL}" -o stok-data.json
          
      - name: JSON Dosyası Kontrolü
        run: |
          if [ ! -s stok-data.json ]; then
            echo "Stok verisi boş geldi!"
            exit 1
          fi

      - name: Değişiklik Varsa Kaydet ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stok-data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update stok-data.json [skip ci]" && git push)
