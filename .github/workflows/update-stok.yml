name: Stok Verisi Güncelleyici

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Python Kur ve Veriyi İndir
        env:
          GAS_URL: ${{ secrets.GAS_API_URL }}
        run: |
          python3 -c "
          import urllib.request, os
          url = os.environ['GAS_URL']
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req) as response, open('stok-data.json', 'wb') as out_file:
              out_file.write(response.read())
          "

      - name: Değişiklik Varsa Kaydet ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stok-data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update stok-data.json [skip ci]" && git push)
